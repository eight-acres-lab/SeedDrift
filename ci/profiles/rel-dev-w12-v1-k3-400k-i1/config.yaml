# Machine i-1: the second, larger training set of tables of version 1 on corpus medium-k3 (stage w12_v1; package W12;
# the programme lead, 2026-11-23: for round 2, built during round 1): 33,600 training tables per group, 403,200 in all,
# from the same search (run 20261123T061001), seed and code as profile rel-dev-w12-v1-k3-i1, but the training targets
# are drawn over all the genes of a group without replacement (train_sampling: gene; the programme lead's rule "the same
# gene as seldom as possible"): every gene of a group is a target once before any is twice, so no target is used more
# than once above the group's mean, and small genomes (viruses, plasmids) no longer take hundreds of tables each. The
# groups keep equal shares. The training tables are drawn anew: not a superset of the 201,600. The 3,000 held-out tables
# (250 per group) are drawn as before and are those of rel-dev-w12-v1-k3-i1 byte for byte. No island tables (built
# once). 32 rows, 8 processes, about 45 GB, about 1-2 hours; CPU priority below the training beside it. Development
# diagnosis only.
pipeline: rel_tables
needs_gpu: false
tier: medium
seed: 1
cores: 8
blas_threads: 1
disk_gb: 55
disk_reserve_gb: 30
corpus_spec: configs/corpus/medium-k3.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w12_v1]
rel_w12_v1:
  search_from: /hy-tmp/seeddrift-ci/runs/20261123T061001-exp-rel-c8f59d82-rel-dev-w12-full-k3-i1
  expect: {train: 1093, heldout: 422, test: 257}
  rows: 32
  train_per_group: 33600
  heldout_per_group: 250
  shard_tables: 2400
  processes: 8
  seed: 1
  name: w12-v1-r32-s1-n33600-bygene
  train_sampling: gene
train:
  gpu_lease: false
  device: cpu
