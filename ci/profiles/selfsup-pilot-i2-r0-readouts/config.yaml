# Machine i-2: round 1 of the new objectives (2026-11-20; the user approved the proposal of the objectives review:
# "我觉得合理，你整理一下告诉一下主会话，让他加上"): readouts only, no training, on three models of the pilot round R0
# (run 20261119T145408 of this machine, imported whole with train.models_from: A+B1+B2+C seed 1, A alone, B1+B2 alone),
# scored on the 24 development chromosomes of the genomic-island set with the island search of i-1 run 20261120T023245
# (islands.reuse_search_from, copied in one batch). New per-gene readouts (train.readouts), new comparators (cmp_kmer,
# cmp_pairnull, cmp_triplet) and the shared test protocol and leak audit in the island report (ci/stages/protocol.py).
# The GPU is shared with the qwen35-bio vLLM service, which must not be stopped: one scoring at a time. Development
# diagnosis only.
pipeline: selfsup
tier: pilot
seed: 1
cores: 8
blas_threads: 2
disk_gb: 40
disk_reserve_gb: 30
gpu_mem_min_mb: 15000
corpus_spec: configs/corpus/pilot-near.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  tables_from: /hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  reuse_from: [/hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot]
  reuse_required: true
train_data:
  hits: 32
pairs:
  sensitivity: sensitive
  max_target_seqs: 500
  evalue: 1.0e-5
  genomes: 64
  threads: 6
  block_size: 4
train:
  model: selfsup_v0
  models_from: /hy-tmp/seeddrift-ci/runs/20261119T145408-exp-truth-labels-c73296e9-selfsup-pilot
  models_wait_s: 14400
  python: /hy-tmp/seeddrift-ci/envs/model-torch/bin/python
  python_lock: ci/envs/model-torch-venv.pip.txt
  seed: 1
  variants:
    - {name: all-s1, seed: 1, objectives: [A, B1, B2, C]}
    - {name: a-s1, seed: 1, objectives: [A]}
    - {name: b-s1, seed: 1, objectives: [B1, B2]}
  # round 1 of the objectives of 2026-11-20 (readouts only, no training): the panels, D2, D3, the
  # codon-usage similarity, the shuffled genome representation, deeper hiding (seeddrift/train/selfsup.py readouts)
  readouts:
    variants: [all-s1, a-s1, b-s1]
    panels: [default, bacteria, near]
    depths: [family, order]
    knn: 8
  parallel: 1
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
islands:
  store: /hy-tmp/seeddrift-store/evalsets/islandpick
  threads: 12                      # part of the reuse key (equal to the run whose search is reused; this machine does not search)
  reuse_search_from: [/hy-tmp/seeddrift-ci/imports/runs/20261120T023245-exp-truth-labels-d823bfc0-selfsup-pilot-i1-gpu]
  reuse_search_required: true
