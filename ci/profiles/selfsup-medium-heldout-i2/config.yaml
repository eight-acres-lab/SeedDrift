# Machine i-2, round R2 of the truth-labels line (2026-11-20), beside profile selfsup-medium-heldout-i1: the medium
# corpus (rebuilt here from the content store copied from i-1), the medium search's hits manifest without its hit files
# (search.reuse_manifest_only) and the training data of round R1 taken whole (train_data.reuse_from; same corpus, hits,
# settings and code, imported from i-1: 3.3 GB instead of 12 GB of hits over the slow link), a random held-out set the
# model never trains on, A alone with two seeds (R1's a-s1 was 0.886 on the islands, trained on train+heldout), and the
# readouts of round 1 on both. No objective C, so no corpus-against-itself search. The GPU is shared with the qwen35-bio
# vLLM service, which must not be stopped: one model at a time. Development diagnosis only.
pipeline: selfsup
tier: medium
seed: 1
cores: 8
blas_threads: 2
disk_gb: 80
disk_reserve_gb: 30
gpu_mem_min_mb: 15000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  tables_from: /hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
fetch:
  allow_missing: 0.01
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  reuse_from: [/hy-tmp/seeddrift-ci/imports/runs/20261118T104626-exp-0.2-pilot-948f2584-medium-search]
  reuse_required: true
  reuse_manifest_only: true
train_data:
  hits: 32
  reuse_from: [/hy-tmp/seeddrift-ci/imports/runs/20261120T054457-exp-truth-labels-9170e09e-selfsup-medium-i1]
  reuse_required: true
train:
  model: selfsup_v0
  python: /hy-tmp/seeddrift-ci/envs/model-torch/bin/python
  python_lock: ci/envs/model-torch-venv.pip.txt
  gpu_lease: false
  device: auto
  seed: 1
  variants:
    - {name: a-s1, seed: 1, objectives: [A]}
    - {name: a-s2, seed: 2, objectives: [A]}
  readouts:
    variants: [a-s1, a-s2]
    panels: [default, bacteria, near]
    depths: [family, order]
    knn: 8
  parallel: 1
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
islands:
  store: /hy-tmp/seeddrift-store/evalsets/islandpick
  threads: 12                      # part of the reuse key (equal to the run whose search is reused; this machine does not search)
  reuse_search_from: [/hy-tmp/seeddrift-ci/imports/runs/20261120T023245-exp-truth-labels-d823bfc0-selfsup-pilot-i1-gpu]
  reuse_search_required: true
