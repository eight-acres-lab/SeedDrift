# Machine i-1: an early comparison of arms S1 and S2 of decision D7 (package W5) beside the reference arm they are set
# against (w6-ref30m-leakfree-lr1.5e-4), in a gap of i-1's GPU before round 1 (the user's go-ahead of 2026-11-23, via
# the programme lead). A development diagnosis on tables of version 0 (the training and held-out sets of round 1b, the
# leak-free arms read on W3's strict offline rendering of run 20261122T132634); not D7's reading of round 1's batch 3,
# and nothing is chosen by it. The three arms run one after another (i-1's GPU holds only one beside another user's
# process) to the same tables seen (max_steps 6,000: 24,000 tables each; batch 3's rule of equal tables), so their bits
# compare at equal tables; their wall time is a cost only and differs with what else shares the GPU. Nodes at 0, 1,000
# and every doubling on the first 50 held-out tables of each group (600, four conditions, online); the end on the same
# 600 on the strict offline rendering. The final weights stay in the run and feed no later training or evaluation.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 21000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_selftest, w6_fit]
  parallel: 1
rel_w6_selftest:
  modules: [seeddrift.train.rel.models.source, seeddrift.train.rel.models.axial]
  threads: 2
  wall_s: 840
rel_w6_fit:
  tables:
    train: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 0}
    heldout: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 1}
    heldout_offline: {run: /hy-tmp/seeddrift-ci/runs/20261122T132634-exp-rel-0200cd06-rel-dev-w3-offline-i1, path: data/rel_w3/offline/tableset.json, sha256: 4d21b19979778b47cd9d2630fe2afeb76387b26a3c8e9a08fbc55efc81b044b1}
  arms:
    - {variant: configs/rel/variants/w6-ref30m-leakfree-lr1.5e-4.yaml, seed: 1}
    - {variant: configs/rel/variants/w5-src30m-s2.yaml, seed: 1}
    - {variant: configs/rel/variants/w5-src30m-s1.yaml, seed: 1}
  max_steps: 6000                # 24,000 tables each: the same tables seen for every arm
  warmup_steps: 1000
  eval_per_group: 50
  final_per_group: 50
  eval_max_rows: 32
  only_conditions: [scattered, whole_gene, scattered+no_relatives, whole_gene+no_relatives]
  eval_online: true
  keep_node_weights: false
  wall_s: 5400                   # 90 min cap for one arm, its final evaluation included; the coordinator stops the run by 21:45
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
