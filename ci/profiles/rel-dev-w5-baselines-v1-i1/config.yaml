# Machine i-1: the classical baselines on the held-out tables of version 1 (stage w5_baselines, package W5), beside
# round 1's report: the 3,000 held-out tables of the tables run of rel-dev-w12-v1-k3-i1 (32 rows, self-copy rows,
# ABSENT blocks), fitted on 6,000 of its training tables (the chain on 1,500). Round 1's final conditions: scattered,
# suffix, whole_gene and whole_gene+repaired read on W3's strict offline rendering of that held-out set (run
# 20261123T124714; layout leakfree, the cells those of the stored tables), scattered+no_relatives and
# whole_gene+no_relatives on the stored tables; the subset of the evaluation during training (50 tables per group) in
# rows_subset.tsv. The strata of the nearest other-genome row and the three relatives strata (evaluator version 4).
# numpy only, two cores: the select lock, no GPU. Development diagnosis only.
pipeline: rel_tables
needs_gpu: false
tier: medium
seed: 1
cores: 2
blas_threads: 2
disk_gb: 1
disk_reserve_gb: 30
corpus_spec: configs/corpus/medium-k3.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w5_baselines]
rel_w5_baselines:
  tables_from: /hy-tmp/seeddrift-ci/runs/20261123T122205-exp-rel-c76dd7cd-rel-dev-w12-v1-k3-i1
  tablesets:
    - {path: data/rel_w12/v1/tableset.json, sha256: dfb612a560fc9cb8991cdb0ffce3541d1bb3ea79ab63489d58a881d5695202c1}
  offline:
    run: /hy-tmp/seeddrift-ci/runs/20261123T124714-exp-rel-8015afa8-rel-dev-w3-offline-v1-i1
    path: data/rel_w3/offline/tableset.json
    sha256: 2f761265d52ac6a09dbea7285f5a90e1e6b0dbea99bb6603c5e6c260f862d496
  conditions: [scattered, suffix, whole_gene, scattered+no_relatives, whole_gene+no_relatives, whole_gene+repaired]
  seed: 20261122
  fit_tables: 6000
  chain_tables: 1500
  subset_per_group: 50
train:
  gpu_lease: false
  device: cpu
