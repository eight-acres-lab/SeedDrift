# Machine i-1, round 1b of the relational-model line (task breakdown 8.6; the programme lead's rulings of 2026-11-22
# and 2026-11-23): the short arms, three at once, about 4 h each, with relatives, seed 1: the 10 M and 30 M arms on the
# leak-free layout (scattered and span rendered leak-free by package W3's renderer, the whole gene kept stored) at the
# evening's rates (4e-4 and 3e-4), and the hierarchical output head (w6-ref30m-hier, the stored layout). A leak-free
# arm is scored on package W3's strict offline rendering of the held-out items (tables.heldout_offline, run
# 20261122T132634), its whole-gene conditions also in the stored layout it was trained in; every arm also on condition
# suffix (the programme lead's ruling on a hidden span). Tables v0. A preflight that fails or a value that is not finite
# stops the arm; nothing lowers the learning rate. The report sets them beside the classical baselines of run
# 20261122T075150. CI 0.5, round 1b's foundation. Development diagnosis only.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 30000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_selftest, w6_fit, w6_report]
  parallel: 3
rel_w6_selftest:
  threads: 2
  wall_s: 840
rel_w6_fit:
  tables:
    train: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 0}
    heldout: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 1}
    heldout_offline: {run: /hy-tmp/seeddrift-ci/runs/20261122T132634-exp-rel-0200cd06-rel-dev-w3-offline-i1, path: data/rel_w3/offline/tableset.json, sha256: 4d21b19979778b47cd9d2630fe2afeb76387b26a3c8e9a08fbc55efc81b044b1}
  arms:
    - {variant: configs/rel/variants/w6-ref10m-leakfree.yaml, seed: 1}
    - {variant: configs/rel/variants/w6-ref30m-leakfree.yaml, seed: 1}
    - {variant: configs/rel/variants/w6-ref30m-hier.yaml, seed: 1}
  wall_s: 14400                  # 4 h: one training, its final evaluation on all 3,000 held-out tables included
  eval_per_group: 50             # the evaluations on the way: the first 50 held-out tables of each group
  eval_max_rows: 32
  extra_conditions: [suffix]
rel_w6_report:
  baselines: [{run: /hy-tmp/seeddrift-ci/runs/20261122T075150-exp-rel-8f20ea37-rel-dev-w5-baselines-i1, path: data/rel_w5/baselines/rows.tsv}]
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
