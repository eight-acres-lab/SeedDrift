# Machine i-1: the stored-layout column of the counting reading of the HGT capability check (protocol w18-v3, version 4), the scoring of
# round 1's batch 2 (run 20261123T230350: ref100m-long, seed 1) at its last node (its final moving-average weights), with
# its presence passes, on the implant tables of version 1 with self-copy rows (run 20261123T132811 of profile
# rel-dev-w18-rulers-v3-i1) under the stored layout (protocol w18-v3, rendering.second_column: the 2 x 2 table's second column). Stage w6_eval in its ruler mode only, as rel-w18c1s-i1 scored batch 1:
# the readout reads this run with those of rel-w18c1s-i1 and rel-w18c1s-i2 (the untrained seed-1 variant of ref30m
# stays the control of every arm). To run from commit 7f7bc6d plus this profile only (the code of the other scorings).
# The protocol's compute switch is on: the presence passes on the in-place triples only. Nothing is trained.
# Expected time with the GPU free (an estimate from the 30 M scorings of 2026-11-24, 960 s and 1,032 s with the presence
# passes, scaled by the parameter count, about 3.5 times): about 45-55 min.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 30000
corpus_spec: configs/corpus/medium-k3.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_eval]
  parallel: 1
rel_w6_eval:
  from: /hy-tmp/seeddrift-ci/runs/20261123T230350-exp-rel-7c02795e-rel-r1long100m-i1
  arms: [w6-ref100m-v1-s1]
  tables:
    heldout: {run: /hy-tmp/seeddrift-ci/runs/20261123T132811-exp-rel-fa0cd396-rel-dev-w18-rulers-v3-i1, path: data/rel_w18/rulers/tableset.json, sha256: 7d08eecb2a370afac59628919f22206959fed5883d6dea415a84d538fe358fb3, split: 1}
  readout: {module: seeddrift.train.rel.readouts.w18_passes, presence_arms: [w6-ref100m-v1-s1], max_rows: 32, layout: stored, in_place_only: true, adapt_v0_arms: false}
  best: false                    # the last node: the final moving-average weights (protocol w18-v3)
  threads: 4
  wall_s: 14400                  # one arm's scoring
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
