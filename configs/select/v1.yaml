# Selection of the multi-kingdom training corpus v1 (pipeline select; profiles select-refresh and, once its lock is
# promoted, select-v1). Every group of configs/kingdom_map.yml with the floors of configs/corpus/floors.yaml
# (target_factor 1.0: the floors themselves; the protein-share repair may raise viral, mobile and eukaryote groups).
# Catalogues: the sources the charter names per kingdom. NCBI RefSeq reference genomes (complete, annotated) for
# bacteria and archaea; NCBI RefSeq complete viral assemblies, plus complete prokaryote-virus assemblies of every source
# (their hosts from the NCBI virus reports); Ensembl release
# 116 and Ensembl Genomes release 63 for eukaryotes (protein counts from the NCBI annotation of the same assemblies).
# What these catalogues leave out is counted with wider queries (`totals`) and reported with the selection; widening a
# catalogue (GenBank-only viruses, draft-only and uncultured prokaryotes, eukaryotes outside Ensembl) is the user's decision.
name: v1
tier: full
seed: 20261117
assumptions: configs/select/assumptions.yaml
target_factor: 1.0
catalogues:
  - id: bacteria
    ncbi_genome_reports: {taxon: 2, params: {filters.reference_only: "true", filters.assembly_source: refseq, filters.assembly_level: complete_genome, filters.has_annotation: "true"}}
    totals:
      refseq complete annotated (not only reference genomes): {filters.assembly_source: refseq, filters.assembly_level: complete_genome, filters.has_annotation: "true"}
      refseq, every assembly level: {filters.assembly_source: refseq}
      every assembly (GenBank and RefSeq): {}
  - id: archaea
    ncbi_genome_reports: {taxon: 2157, params: {filters.reference_only: "true", filters.assembly_source: refseq, filters.assembly_level: complete_genome, filters.has_annotation: "true"}}
    totals:
      refseq complete annotated (not only reference genomes): {filters.assembly_source: refseq, filters.assembly_level: complete_genome, filters.has_annotation: "true"}
      refseq, every assembly level: {filters.assembly_source: refseq}
      every assembly (GenBank and RefSeq): {}
  - id: viruses
    ncbi_genome_reports: {taxon: 10239, params: {filters.assembly_source: refseq, filters.assembly_level: complete_genome}}
    totals:
      complete assemblies, GenBank and RefSeq: {filters.assembly_level: complete_genome}
      every viral assembly: {}
  - id: virus_hosts
    ncbi_virus_reports: {taxon: 10239, params: {filter.refseq_only: "true", filter.complete_only: "true"}}
  # prokaryote viruses from every INSDC source (GenBank and RefSeq; the charter names ENA's viral assemblies): the taxa of
  # configs/kingdom_map.yml viruses.phage, complete assemblies, and the hosts of their nucleotide records
  - id: phages
    ncbi_genome_reports: {taxon: [2731619, 10841, 10860, 10656, 10659, 10877, 2842243, 10472], params: {filters.assembly_level: complete_genome}}
  - id: phage_hosts
    ncbi_virus_reports: {taxon: [2731619, 10841, 10860, 10656, 10659, 10877, 2842243, 10472], params: {filter.complete_only: "true"}}
  - {id: ens_vertebrates, ensembl_species: {site: ensembl, division: vertebrates, release: 116}}
  - {id: ens_plants, ensembl_species: {site: ensemblgenomes, division: plants, release: 63}}
  - {id: ens_fungi, ensembl_species: {site: ensemblgenomes, division: fungi, release: 63}}
  - {id: ens_metazoa, ensembl_species: {site: ensemblgenomes, division: metazoa, release: 63}}
  - {id: ens_protists, ensembl_species: {site: ensemblgenomes, division: protists, release: 63}}
  - id: ens_annotation
    ncbi_genome_accessions: {from: [ens_vertebrates, ens_plants, ens_fungi, ens_metazoa, ens_protists], field: assembly_accession}
    totals:
      NCBI annotated eukaryote reference genomes (outside Ensembl too): {_kind: ncbi_genome_reports, _taxon: 2759, filters.reference_only: "true", filters.has_annotation: "true"}
  - id: replicons
    ncbi_sequence_reports: {from: [bacteria, archaea]}
rules:
  prokaryotes: {catalogues: [bacteria, archaea], min_protein_coding: 500, outer: order, cap_per_genus: 3}
  plasmids: {replicons: replicons, outer: order, cap_per_genus: 3}
  # unknown_host: exclude (strict; v1-relaxed.yaml keeps them, for an A/B comparison)
  viruses: {catalogues: [viruses, phages], hosts: [virus_hosts, phage_hosts], outer: family, cap_per_genus: 3, require_complete: true, unknown_host: exclude}
  eukaryotes: {catalogues: [ens_vertebrates, ens_plants, ens_fungi, ens_metazoa, ens_protists], annotation: ens_annotation, outer: order, cap_per_genus: 2}
share_repair: true
