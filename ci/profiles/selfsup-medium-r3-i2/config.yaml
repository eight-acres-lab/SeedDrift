# Machine i-2, round R3 of the truth-labels line (2026-11-20), beside profile selfsup-medium-r3-i1: the medium corpus
# split three ways (train_data.test_split: true), so line 0.2's sealed test part (257 genomes; the user: "Keep them
# out") is never trained on: train 711, held out 278, test sealed. The training data are R3-i1's, taken whole
# (train_data.reuse_from; same corpus, hits, settings and code, imported from i-1 over the HTTPS route, its per-genome
# arrays identical to R1's), with the medium search's hits manifest only (search.reuse_manifest_only). A alone with two
# seeds, and the readouts of round 1 on both. No objective C, so no corpus-against-itself search. The GPU is shared
# with the qwen35-bio vLLM service, which must not be stopped: one model at a time. Development diagnosis only.
pipeline: selfsup
tier: medium
seed: 1
cores: 8
blas_threads: 2
disk_gb: 80
disk_reserve_gb: 30
gpu_mem_min_mb: 15000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  tables_from: /hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
fetch:
  allow_missing: 0.01
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  reuse_from: [/hy-tmp/seeddrift-ci/imports/runs/20261118T104626-exp-0.2-pilot-948f2584-medium-search]
  reuse_required: true
  reuse_manifest_only: true
train_data:
  hits: 32
  test_split: true                 # the sealed test part of line 0.2 kept out (three_way, ci/stages/train_data.py)
  reuse_from: [/hy-tmp/seeddrift-ci/imports/runs/20261120T155822-exp-truth-labels-a568390f-selfsup-medium-r3-i1]
  reuse_required: true
train:
  model: selfsup_v0
  python: /hy-tmp/seeddrift-ci/envs/model-torch/bin/python
  python_lock: ci/envs/model-torch-venv.pip.txt
  gpu_lease: false
  device: auto
  seed: 1
  variants:
    - {name: a-s1, seed: 1, objectives: [A]}
    - {name: a-s2, seed: 2, objectives: [A]}
  readouts:
    variants: [a-s1, a-s2]
    panels: [default, bacteria, near]
    depths: [family, order]
    knn: 8
  parallel: 1
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
islands:
  store: /hy-tmp/seeddrift-store/evalsets/islandpick
  threads: 12                      # part of the reuse key (equal to the run whose search is reused; this machine does not search)
  reuse_search_from: [/hy-tmp/seeddrift-ci/imports/runs/20261120T023245-exp-truth-labels-d823bfc0-selfsup-pilot-i1-gpu]
  reuse_search_required: true
