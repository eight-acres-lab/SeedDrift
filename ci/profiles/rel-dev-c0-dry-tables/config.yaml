# Dry-run profile of kind rel_tables (configs/rel/kinds.yaml): every stage of the kind, for the static check only
# (`python -m ci check` plans it with Snakemake; the stub stages fail if it is ever run). Owned by the coordinator (C0).
pipeline: rel_tables
needs_gpu: false
tier: tiny
seed: 1
cores: 2
blas_threads: 1
disk_gb: 1
disk_reserve_gb: 30
corpus_spec: configs/corpus/ci-tiny.yaml
taxdump: tests/ci/fixtures/tiny/taxdump
rel:
  machine: i1
  stages: [c0_synth, w2_dist, w2_v0, w5_items, w2_items, w3_offline, w2_census, w12_search, w12_v1]
train:
  gpu_lease: false
  device: cpu
