# The lock calendar of the relational-model line, 2026-11-23 to 2026-11-29 (task breakdown 8.3; written by the
# coordinator C0, version 5 of 2026-11-23, 03:00). Times UTC+8, approximate; dates are targets, a day late is better than
# rushed. Every machine has two locks: gpu (profiles without the line `needs_gpu: false`) and select (profiles with it).
# A second launch on a held lock is refused, never queued.
#
# Rules this calendar follows
# - Round rhythm (8.6, the user: "10 个小时到 12 个小时均可。最好是训练一个长一些的，多验证几个短的"): one long training
#   (10 to 12 h) alone on i-2's A100 (one training at a time beside the vLLM service, which is never stopped), and the
#   short ones (3 to 5 h each, three at once) on i-1.
# - Long CPU runs go on a machine that is not training at the time; they come in parts of at most 3 hours. i-1's CPU
#   quota is shared with other users' processes (on 2026-11-22 from about 17:20 to 18:30 it was full), so a CPU run there
#   may be slow; i-2 has 8 CPUs.
# - All select runs of one machine on one day go into one combined profile (rel-dev-c0-day<MMDD>-<machine>) unless a
#   run is long or depends on another's output; runs under 15 minutes may run whenever the lock is free.
# - Besides a training, a CPU run uses at most 2 threads.
# - A package asks for a slot with a request file (configs/rel/requests/); the coordinator moves slots and records it here.
# - Priority (the user, 2026-11-22: "优先验证 HGT 的场景，其他的场景暂时可以后置"; task breakdown 8.8): the runs of W18
#   (the HGT capability check: building its ruler tables, its evaluation-only GPU runs) come right after W12's uncapped
#   search and before the short arms of a round; where they clash, W18's run keeps its slot and the short arms move.
# - Checkpoints of test-phase models are not copied over R2: an arm is evaluated on the machine that trained it, and
#   only its evaluation run (without *.pt) comes back to i-1.
# - Version 4 (the programme lead, 2026-11-22 evening): W12's search first; the hierarchical output head is no longer a
#   run of its own (it becomes a short arm of round 1b); W18's first reading (4 to 5 h of GPU) after W12's search parts
#   and before round 1b's short arms; the 100 M arm at 2e-4 is read on i-2 after round 1a's long arm.
# - Version 5 (the programme lead, 2026-11-23 night): W18's first reading on i-1 does not wait for W12's search parts; it
#   starts when round 1a's short arms free the GPU and runs beside W12's trial and parts (W18 at most 4 CPU threads, W12
#   12; W18 lowered to 2 if W12's parts slow by more than 20 %, never stopped). The user's k = 3 (task breakdown 8.11):
#   W13's download F on i-1 tonight; its corpus build in three runs S1, S2, B (12 threads, about 2.2-2.6 h each, i-1
#   only), before or after W12's version 1 by the programme lead's choice after the trial.
version: 5
days:
  "2026-11-23":
    i1:
      gpu:
        - {from: "00:43", to: "00:47", what: "W6's suffix evaluation of the evening's 10 M and 30 M arms (run 20261122T164333)", packages: [W6], status: done}
        - {from: "00:47", to: "about 05:00", what: "round 1a, the short arms (run 20261122T164736: w6-ref30m-lr1.5e-4, w6-ref30m-lr6e-4, w6-ref100m-lr1e-4, wall_s 14,400 each)", packages: [W6], status: running}
        - {from: "when the short arms end", hours: "2.5 to 3", what: "W18's first reading (profile rel-w18v0-i1: stage w6_eval in ruler mode and w18_readout over w6-ref30m, w6-ref30m-norel, w6-ref10m, w6-ref100m-lr4e-4 and the untrained arm; 4 CPU threads), beside W12's trial and parts", packages: [W18, W6], status: planned}
      select:
        - {from: "00:21", to: "02:42", what: "done: W6's ladder report (20261122T162205) and learning-rate report (20261122T164415); W13's pick (20261122T161536), download F (20261122T164430, failed on a record the archive does not serve), scaffold count (20261122T164959) and the pick again by the new rule (20261122T183639); W15's registry, second run passed (20261122T153204), third failed (20261122T175251)", packages: [W6, W13, W15], status: done}
        - {from: "when W2's corpus spec of the new pick passes", to: "05:30", what: "W13's download F (profile rel-dev-w13-fetch-i1; 2 cores, 8 network threads, about 1.5-2 GB, 0.5-1.5 h); started only before 04:00, else in a gap of W12's parts", packages: [W13], status: planned}
        - {from: "not before 05:30, when the short arms end", what: "W12's 1 % trial of the uncapped search (profile rel-dev-w12-trial-i1; 12 threads, 10 to 20 minutes): wall time, rows, bytes per row, disk extrapolated; then, with rel-w2, the estimate for the programme lead's choice (task breakdown 8.11)", packages: [W12], status: planned}
        - {from: "after the trial", what: "by the programme lead's choice: either W13's build S1, S2, B (about 7 h in three runs) and then W12's merged uncapped search, or W12's search of version 1 in parts of at most 3 h and W13's build after it; W15's fourth registry run (1 to 1.5 h, 1 thread) in a gap", packages: [W12, W13, W15], status: tentative}
    i2:
      gpu:
        - {from: "00:22", to: "about 11:40", what: "round 1a, the long arm (run 20261122T162214: w6-ref30m at 3e-4, the programme lead's verdict B, wall_s 39,600)", packages: [W6], status: running}
        - {from: "after the long arm", hours: "about 1", what: "W18's reading of the 100 M arm at 2e-4 (profile rel-w18v0-i2) on its checkpoint of run 20261122T071650-exp-rel-3382ed5e-rel-d1-i2; the ruler tables are on i-2 since 11-22 23:54 (copied over R2, every file checked by sha256); the evaluation run copied back to i-1 without checkpoints; then W18's readout-only profile over both evaluation runs", packages: [W18, C0], status: planned}
        - {from: "after W18's reading", hours: "10 to 12", what: "round 1b, the long arm on the leak-free placement: the best configuration of round 1a (W3's offline run copied to i-2 first)", packages: [W6, W3], status: tentative}
  "2026-11-24":
    i1:
      gpu:
        - {from: "after W18's first reading", hours: "4 to 5", what: "round 1b, the short arms on the leak-free placement (three at once, wall_s 14,400): 10 M and 30 M with relatives (the leak's size against the evening's arms) and the hierarchical output head (w6-ref30m-hier)", packages: [W6, W3], status: tentative}
      select:
        - {from: "after W12's search", what: "W12: tables v1 and the island set (stages w12_v1, w12_islands), in parts of at most 3 h; then their census", packages: [W12], status: tentative}
    i2:
      gpu:
        - {what: "round 1b's long arm (from 11-23)", status: tentative}
  "2026-11-25":
    i1:
      select:
        - {from: "08:00", to: "11:00", what: "combined CPU profile (rel-dev-c0-day1125-i1): W3 step 1, the strict offline rendering of the held-out items of tables v0", packages: [W3], status: planned}
      gpu:
        - {what: "open: re-checks of rounds 1a and 1b", status: open}
    i2:
      select:
        - {what: "tables v1 copied to i-2 over R2 (the coordinator), every file checked by sha256, once they are built; if the copy fails, round 1's arms with relatives run on i-1 only", packages: [C0], status: planned}
      gpu:
        - {what: "open after round 1b", status: open}
  "2026-11-26":
    i1:
      select:
        - {what: "combined CPU profile: W5's items on tables v1; the strict rendering of those items (W3 step 2)", packages: [W5, W3], status: planned}
      gpu:
        - {what: "the reference arm's capability check (synthetic tables)", packages: [W6], status: planned}
  "2026-11-29":
    i1:
      gpu:
        - {what: "round 1 (tables v1 plus two days, not before 11-29; an earlier v1 lets the programme lead move it): the short arms, by the programme lead's protocol (configs/rel/protocols/)", packages: [P0, W6], status: tentative}
    i2:
      gpu:
        - {what: "round 1: the long arm", packages: [P0, W6], status: tentative}
