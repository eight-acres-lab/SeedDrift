# Machine i-1: the saved weights of the three arms of run 20261122T071504-exp-rel-3382ed5e-rel-d1-i1 evaluated again on
# all 3,000 held-out tables (stage w6_eval, package W6), because another user's processes starved that run of CPU from
# about 17:20 and its final evaluations did not fit the wall limit. Nothing is trained; final.pt (and best.pt of the arm
# without relatives) are read as the training's own final evaluation would have read them. Development diagnosis only.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 5
disk_reserve_gb: 30
gpu_mem_min_mb: 20000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_eval]
  parallel: 1
rel_w6_eval:
  from: /hy-tmp/seeddrift-ci/runs/20261122T071504-exp-rel-3382ed5e-rel-d1-i1
  tables:
    heldout: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 1}
  eval_max_rows: 32
  threads: 4
  wall_s: 10800                  # one arm's evaluation; generous while i-1's CPUs are shared with another user's processes
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
