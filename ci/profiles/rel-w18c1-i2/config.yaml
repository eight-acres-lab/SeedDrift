# Machine i-2: the counting reading of the HGT capability check (protocol w18-v3, version 4), the scoring of round 1's
# long arm (run 20261123T150503: ref30m-long, seed 1) at its last node (its final moving-average weights) and of the
# untrained model, the ref30m variant with seed 1 (the arm as built with its seed, never trained): the one untrained
# control of every arm. Implant tables of version 1 with self-copy rows (run 20261123T132811) and their strict offline
# rendering (run 20261123T151318), both copied from i-1 over R2 into imports/runs/, every file checked by sha256. Stage
# w6_eval in its ruler mode only: the readout (w18_readout) reads this run on i-1 with batch 1's. The protocol's compute
# switch is on: the untrained model and the presence passes on the in-place triples only. Nothing is trained.
# Expected time with the GPU free (an estimate, not a measurement; from rel-w18v1a-i1 as in rel-w18c1-i1): ref30m-long with
# its presence passes about 35-40 min, the untrained model on the in-place tables about 20-25 min. This profile (strict
# offline): about 1 h; with the stored-layout reading (rel-w18c1s-i2) about 2 h in all.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 20000
corpus_spec: configs/corpus/medium-k3.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i2
  stages: [w6_eval]
  parallel: 1
rel_w6_eval:
  from: /hy-tmp/seeddrift-ci/runs/20261123T150503-exp-rel-f17fff25-rel-r1long-i2
  arms: [w6-ref30m-v1-s1, {name: w6-ref30m-v1-s1, untrained: true}]
  tables:
    heldout: {run: /hy-tmp/seeddrift-ci/imports/runs/20261123T132811-exp-rel-fa0cd396-rel-dev-w18-rulers-v3-i1, path: data/rel_w18/rulers/tableset.json, sha256: 7d08eecb2a370afac59628919f22206959fed5883d6dea415a84d538fe358fb3, split: 1}
  readout: {module: seeddrift.train.rel.readouts.w18_passes, presence_arms: [w6-ref30m-v1-s1], max_rows: 32, layout: leakfree,
            offline: /hy-tmp/seeddrift-ci/imports/runs/20261123T151318-exp-rel-36fa1982-rel-dev-w18-offline-v3-i1, in_place_only: true, adapt_v0_arms: false}
  best: false                    # the last node: the final moving-average weights (protocol w18-v3)
  threads: 4
  wall_s: 14400                  # one arm's scoring
train:
  gpu_lease: false
  device: auto
  python: /hy-tmp/seeddrift-ci/envs/model-torch/bin/python
  python_lock: ci/envs/model-torch-venv.pip.txt
