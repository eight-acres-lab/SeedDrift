# Machine i-1, round R2 of the truth-labels line (2026-11-20): R1 again with a random held-out set that the model never
# trains on (the user: early checks keep a random held-out set, "这不变成背答案了吗？"; R1 trained on train+heldout), three
# seeds of A+B1+B2+C (the side session's suggestion, passed on with the user's consent: scale the learned model, near
# panel, 2-3 seeds), and the readouts of round 1 on every model. Same corpus, search, training data, pairs, steps and
# island search as R1, so R1's island numbers and these differ only by the held-out genomes and the seeds.
# Development diagnosis only.
pipeline: selfsup
tier: medium
seed: 1
cores: 14
blas_threads: 2
disk_gb: 80
disk_reserve_gb: 30
gpu_mem_min_mb: 20000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  cache: true
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
fetch:
  allow_missing: 0.01
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  reuse_from: [/hy-tmp/seeddrift-ci/runs/20261118T104626-exp-0.2-pilot-948f2584-medium-search]
  reuse_required: true
train_data:
  hits: 32
pairs:
  sensitivity: sensitive
  max_target_seqs: 500
  evalue: 1.0e-5
  genomes: 64
  threads: 12
  block_size: 4
train:
  model: selfsup_v0
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
  gpu_lease: false
  device: auto
  seed: 1
  variants:
    - {name: all-s1, seed: 1, objectives: [A, B1, B2, C]}
    - {name: all-s2, seed: 2, objectives: [A, B1, B2, C]}
    - {name: all-s3, seed: 3, objectives: [A, B1, B2, C]}
  readouts:
    variants: [all-s1, all-s2, all-s3]
    panels: [default, bacteria, near]
    depths: [family, order]
    knn: 8
  parallel: 3
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
islands:
  store: /hy-tmp/seeddrift-store/evalsets/islandpick
  threads: 12
  reuse_search_from: [/hy-tmp/seeddrift-ci/runs/20261120T023245-exp-truth-labels-d823bfc0-selfsup-pilot-i1-gpu]
  reuse_search_required: true
