# Machine i-1: the 1% trial of the uncapped search (stage w12_search; package W12; task breakdown section 8.1, item 2).
# The database holds the proteins of the 711 training genomes of the medium corpus; 1% of the query proteins of the 989
# training and held-out genomes, drawn per group, are searched against it with the settings and thread count of the
# full search, and the held-out ones also against their own genome's proteins. Every target and every alignment is
# kept; no score or rank is stored. The sealed test split is not opened. The run records wall times, rows and bytes and
# extrapolates them linearly to the full search, with the disk it needs. CPU only (the select lock). Development
# diagnosis only.
pipeline: rel_tables
needs_gpu: false
tier: medium
seed: 1
cores: 12
blas_threads: 1
disk_gb: 5
disk_reserve_gb: 30
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w12_search]
rel_w12_search:
  source: /hy-tmp/seeddrift-ci/runs/20261120T155822-exp-truth-labels-a568390f-selfsup-medium-r3-i1
  expect: {train: 711, heldout: 278, test: 257}
  sample: 0.01
  seed: 1
  threads: 12
  block_size: 4
  sensitivity: sensitive
  evalue: 1.0e-5
  chunk_proteins: 60000
  self_batch_proteins: 30000
  probe_proteins: 200
train:
  gpu_lease: false
  device: cpu
