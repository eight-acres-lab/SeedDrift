# Machine i-2, round P1 of the truth-labels line (2026-11-20; the main session took the line over; the user: use both
# GPUs, rounds of 2-3 hours). Development diagnosis only. Same corpus (pilot-near), search, training data and pairs as
# profile selfsup-pilot (run 20261119T145408); no island stages here: this machine has no complete reference database,
# so the variants are scored on the island chromosomes afterwards from the island data of the i-1 run, in one batch.
# The GPU is shared with the qwen35-bio vLLM service, which must not be stopped (the user, 2026-11-20; the GPU lease of
# this machine is disabled): about 20 GB are free once that service runs at 0.5 of the GPU, so one training at a time.
# Variants (all four objectives): the loss trim 0 and 0.25 against the default 0.1, and one more seed (4) beside seeds
# 1-3 of selfsup-pilot, for the seed spread on the islands.
pipeline: selfsup
tier: pilot
seed: 1
cores: 8
blas_threads: 2
disk_gb: 40
disk_reserve_gb: 30
gpu_mem_min_mb: 15000
corpus_spec: configs/corpus/pilot-near.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  tables_from: /hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  reuse_from: [/hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot]
  reuse_required: true
train_data:
  hits: 32
pairs:
  sensitivity: sensitive
  max_target_seqs: 500
  evalue: 1.0e-5
  genomes: 64
  threads: 6
  block_size: 4
train:
  model: selfsup_v0
  python: /hy-tmp/seeddrift-ci/envs/model-torch/bin/python
  python_lock: ci/envs/model-torch-venv.pip.txt
  seed: 1
  variants:
    - {name: all-trim0-s1, seed: 1, objectives: [A, B1, B2, C], trim: 0.0}
    - {name: all-trim25-s1, seed: 1, objectives: [A, B1, B2, C], trim: 0.25}
    - {name: all-s4, seed: 4, objectives: [A, B1, B2, C]}
  parallel: 1
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
