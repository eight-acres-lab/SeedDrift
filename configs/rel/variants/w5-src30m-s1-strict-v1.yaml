# Arm S1 of decision D7 (task-breakdown 8.14; package W5) for round 1's batch 3: the source path (models/source.py, arm s1).
# Set against w6-ref30m-strict-v1, the reference of batch 3 (protocol round1, version 9), which it copies but for the
# model: the reference trunk's 12 blocks of width 384, the first 4 run with every row alone (the own-row branch), the
# other 8 across the table; the same cost per step. Tables of version 1 (4 to 32 rows kept, self-copy rows in);
# scattered and span trained on package W3's strict rendering (tables/strict.py, done by the trainer's sampler), the
# whole gene on its frame relative by W3's strict aligner after the rows are drawn. w5-src30m-s1-v1 is the same arm on
# the leak-free layout, beside w6-ref30m-v1.
# The programme lead (2026-11-23): its cross-row depth is 8 layers and its own-row branch 4, so a small loss against
# the reference arm under the two conditions without relatives is expected and not counted against it.
name: w5-src30m-s1-strict-v1
author: w5
api: 1
model: source
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table
layout: strict                            # scattered and span: W3's strict rendering
whole_gene_layout: frame                  # W3's strict aligner on the rows drawn, then rendered leak-free
rows: [4, 32]
columns: 1024
size: {layers: 12, width: 384, arm: s1, self_layers: 4}
relatives: true
optimizer: {lr: 1.5e-4}
micro: 2
gpu_mb: 29000                             # the reference arm's 28 GB and about 1 GB for the output layer; the profile may lower the micro-batch (arms[].micro)
alone_share: 0.05                         # as the reference arm
tables: real
