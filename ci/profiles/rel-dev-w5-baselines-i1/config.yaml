# Machine i-1: the classical baselines of the relational-model line on the held-out tables of the first tables run
# (stage w5_baselines, ci/stages/rel/w5_baselines.py; package W5 with the copying chain of W10). What the first models
# have to get under: bits per codon of the hidden residues of the examined row under the evaluation conditions of
# seeddrift/train/rel/evalh/conditions.py (scattered cells; the whole target gene; both without relatives; the whole
# gene with the rows re-paired), per group and per identity of the nearest row. numpy only: the select lock, no GPU.
# Coverage: the 12 groups of the table set, held-out genomes examined, training genomes as the other rows; nothing of
# the sealed test part. Limits (written into the results): the stored layout makes the whole-gene numbers an upper
# bound; rows are drawn among genomes with a homolog row on the target gene, so the worth of relatives is
# overestimated; one seed, no noise floor. Development diagnosis only.
pipeline: rel_tables
needs_gpu: false
tier: medium
seed: 1
cores: 2
blas_threads: 2
disk_gb: 1
disk_reserve_gb: 30
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w5_baselines]
rel_w5_baselines:
  # the passed tables run of package W2 (tables of version 0, 100,800 training and 3,000 held-out tables) and the
  # sha256 its table-set manifest carries (checked against that run's record before anything is read)
  tables_from: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1
  tablesets:
    - {path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a}
  seed: 20261122
  fit_tables: 6000
  chain_tables: 1500
train:
  gpu_lease: false
  device: cpu
