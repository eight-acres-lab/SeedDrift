# Machine i-1, today's first readings of the relational-model line (2026-11-22; the programme lead's protocol of that day,
# sections 4 and 9): three arms of the axial reference trunk on the tables of version 0, one seed each: about 30 M
# parameters with relatives and without them, about 10 M with relatives (the 100 M arm trains on i-2, profile rel-d1-i2).
# The self-tests of the torch code run first (CPU, GPU hidden); no training starts before they pass. Tables: run
# 20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1 (sealed record in its manifest).
# Readings are development diagnoses: stored placement (whole_gene is an upper bound), rows drawn among genomes with
# a homolog row on the target gene, learning rates not tuned, no noise floor. Wall limit of a training 4.5 h.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 30000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_selftest, w6_fit, w6_report]
  parallel: 3
rel_w6_selftest:
  threads: 2
  wall_s: 840
rel_w6_fit:
  tables:
    train: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 0}
    heldout: {run: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 1}
  arms:
    - {variant: configs/rel/variants/w6-ref30m.yaml, seed: 1}
    - {variant: configs/rel/variants/w6-ref30m-norel.yaml, seed: 1}
    - {variant: configs/rel/variants/w6-ref10m.yaml, seed: 1}
  wall_s: 16200                  # one training, its final evaluation on all 3,000 held-out tables included
  eval_per_group: 50             # the evaluations on the way: the first 50 held-out tables of each group
  eval_max_rows: 32
rel_w6_report:
  baselines: [{run: /hy-tmp/seeddrift-ci/runs/20261122T062939-exp-rel-f4e79129-rel-dev-w5-baselines-i1, path: data/rel_w5/baselines/rows.tsv}]
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
