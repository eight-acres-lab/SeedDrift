# rel-srcaa-i2 (package W5; the programme lead's rulings of 2026-11-24): the development comparison of copy-aa30m, arm S2
# with an amino-acid copy level (configs/rel/variants/w5-copy-aa30m.yaml), beside S2 itself (w5-src30m-s2, aa_level
# off) in the same run: the same code, machine and seed, one arm after the other (parallel 1: i-2's GPU does not hold
# two). copy-aa30m is judged against this run's S2 only; the early comparison (rel-srcearly-i1, run 20261123T110619:
# S2 and S1 at micro-batch 4; rel-srcearlyref-i1, run 20261123T122356: the reference arm), on code several versions
# older, is listed beside as a reference only, and this run's S2 against 110619's tells how far the code's versions,
# the micro-batch (2 here, 4 there) and the machine together moved the result.
# Conditions as the early comparison's: the same tables of version 0 (the same files, imported to i-2), 3,500 steps of
# 4 tables (14,000 tables), seed 1, the same evaluations; i-2's A100 in a gap of its GPU, as a filler.
# A diagnosis, not a decision.
# Time on i-1's A800 for S2: 6 min of preflight, 15 min of training, 4 min of final evaluation; on i-2 expect about
# 70 to 80 minutes in all for the two arms with the self-test.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 20000           # i-2's A100 has 40 GB, about 21.9 GB free beside the vLLM service; S2 peaked at 16.6 GB at micro 4 (preflight), less at micro 2
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i2
  stages: [w6_selftest, w6_fit]
  parallel: 1
rel_w6_selftest:
  modules: [seeddrift.train.rel.models.source, seeddrift.train.rel.models.axial]
  threads: 2
  wall_s: 840
rel_w6_fit:
  tables:
    train: {run: /hy-tmp/seeddrift-ci/imports/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 0}
    heldout: {run: /hy-tmp/seeddrift-ci/imports/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1, path: data/rel_w2/v0/tableset.json, sha256: 5e48359628e69cea45b1dc1f2bf8ec9696a0f951c0c9215ef32e7efb0a5b827a, split: 1}
    heldout_offline: {run: /hy-tmp/seeddrift-ci/imports/runs/20261122T132634-exp-rel-0200cd06-rel-dev-w3-offline-i1, path: data/rel_w3/offline/tableset.json, sha256: 4d21b19979778b47cd9d2630fe2afeb76387b26a3c8e9a08fbc55efc81b044b1}
  arms:                          # both arms at the same micro-batch (the protocol's margin rule on i-2: 16.6 GB x 1.1 + 6.1 at micro 4 is above the ~21.9 GB free)
    - {variant: configs/rel/variants/w5-src30m-s2.yaml, seed: 1, micro: 2}
    - {variant: configs/rel/variants/w5-copy-aa30m.yaml, seed: 1, micro: 2}
  max_steps: 3500                # 14,000 tables, as every arm of the early comparison
  warmup_steps: 1000
  eval_per_group: 50
  final_per_group: 50
  eval_max_rows: 32
  only_conditions: [scattered, whole_gene, scattered+no_relatives, whole_gene+no_relatives]
  eval_online: true
  keep_node_weights: false
  wall_s: 2700                   # the stage's limit is per training: 45 min for each arm, 90 min for the two one after the other (with up to 15 min of preflight each); each is expected to end by its 3,500 steps in about 30 to 35 min
train:
  gpu_lease: false
  device: auto
  python: /hy-tmp/seeddrift-ci/envs/model-torch/bin/python
  python_lock: ci/envs/model-torch-venv.pip.txt
