[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seeddrift"
version = "0.1.0"
description = "Which genes drifted in from elsewhere: horizontal gene transfer detection, donors and a single-genome screen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
app = ["biopython>=1.80", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart", "pyrodigal>=3.5,<4"]
tools = ["biopython>=1.80", "fastapi>=0.110", "uvicorn>=0.29", "pyhmmer>=0.12"]
esmfold = ["torch>=2.1", "transformers==4.49.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
seeddrift = "seeddrift.__main__:main"

[tool.setuptools]
packages = ["seeddrift"]
