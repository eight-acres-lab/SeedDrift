# Machine i-1: how often the target genes of the tables of version 0 are used, per group (stage w12_tstats; package
# W12; asked by package W6 for the programme lead's reading of round 1a: per group the genes that can be a target and
# the training genomes, row 0, of the 100,800 training tables of run 20261122T061139, rel-dev-w2-v0-i1, whose source is
# round R3's run). Reads the tables and the codon offsets of the training data; writes no table. A few minutes, 2 cores
# (beside a training). CPU only (the select lock). Development diagnosis only.
pipeline: rel_tables
needs_gpu: false
tier: medium
seed: 1
cores: 2
blas_threads: 1
disk_gb: 1
disk_reserve_gb: 30
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w12_tstats]
rel_w12_tstats:
  tables_from: /hy-tmp/seeddrift-ci/runs/20261122T061139-exp-rel-b6b3e7e3-rel-dev-w2-v0-i1
  which: v0
train:
  gpu_lease: false
  device: cpu
