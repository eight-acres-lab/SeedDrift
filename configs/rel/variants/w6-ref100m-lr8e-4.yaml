# Round 1a (task-breakdown section 8.6): a copy of w6-ref100m.yaml with another peak learning rate, 8e-4 (twice the 4e-4 of the evening's check); every other key
# unchanged. One of the short arms that bracket the rate of the width rule; the stored layout, version 0 of the tables.
# The large size of the reference arm: 12 layers, width 768 (113 M parameters), relatives given. On a GPU with about
# 20 GB free one table of 16 rows is a micro-batch (the preflight halves the micro-batch until it fits gpu_mb).
name: w6-ref100m-lr8e-4
author: w6
api: 1
model: axial
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table, drawn uniformly
layout: stored
rows: [4, 16]
columns: 1024
size: 100m
relatives: true
optimizer: {lr: 8.0e-4}                   # round 1a: one side of the width rule's rate, the only change
gpu_mb: 18000
micro: 1                                  # one table per micro-batch from the start: on i-2 the preflight must not try 4 and 2
alone_share: 0.05                         # tables without other rows at most 5% of a group's draws (today's ruling)
tables: real
