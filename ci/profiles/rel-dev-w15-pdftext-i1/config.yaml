# Machine i-1: the text of the PDF supplements the fifth registry run stored (stage w15_registry, ci/stages/rel/
# w15_registry.py, item 7; package W15): Dunning 2019's SI appendix and Datasets S2 to S5, and the PDF supplements of
# the other papers that run fetched. The source run must have passed with its registry gate passed, its report must be
# the output its stage recorded and every file's bytes must match the sha256 that report records;
# bench/rel/registry/pdf_text.py 0.2 (standard library) gives the text of readable pages only and the reason for every
# other page (a font without a character map, garbage under the thresholds, a broken stream, a limit reached, a page
# without text). Texts go to the run's data folder. No paper is fetched, no model output and no score is read. The
# select lock, no GPU, no network. Development diagnosis only.
pipeline: rel_events
needs_gpu: false
tier: medium
seed: 1
cores: 1
blas_threads: 1
disk_gb: 1
disk_reserve_gb: 30
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w15_registry]
rel_w15_registry:
  registry:
    - bench/rel/registry/events_v0.2-sample.tsv
    - bench/rel/registry/events_v0.2-batch2.tsv
    - bench/rel/registry/events_v0.2-batch3.tsv
    - bench/rel/registry/events_v0.2-batch4.tsv
    - bench/rel/registry/events_v0.2-batch5.tsv
  fetch: false
  pdf_text:
    from_run: /hy-tmp/seeddrift-ci/runs/20261123T163435-exp-rel-1bb84c47-rel-dev-w15-registry-i1
    files: ["*.pdf"]
train:
  gpu_lease: false
  device: cpu
