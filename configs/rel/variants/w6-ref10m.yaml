# The small size of the reference arm: 8 layers, width 256 (8.4 M parameters), relatives given.
name: w6-ref10m
author: w6
api: 1
model: axial
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table, drawn uniformly
layout: stored
rows: [4, 16]
columns: 1024
size: 10m
relatives: true
optimizer: {lr: 4.0e-4}                   # today's rule: 3e-4 at width 384, scaled by the inverse square root of the width
gpu_mb: 14000
alone_share: 0.05                         # tables without other rows at most 5% of a group's draws (today's ruling)
tables: real
