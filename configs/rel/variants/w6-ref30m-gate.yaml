# The reference arm with the gate switched on (the reference trunk's switch: the cells of the relation blocks attend
# along the row only to relation blocks, the cells of the focus blocks to every block), relatives given; otherwise
# w6-ref30m. For the comparison with and without the gate in round 1.
name: w6-ref30m-gate
author: w6
api: 1
model: axial
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table, drawn uniformly
layout: stored
rows: [4, 16]
columns: 1024
size: {layers: 12, width: 384, gate: true}
relatives: true
optimizer: {lr: 3.0e-4}                   # today's rule: 3e-4 at width 384, scaled by the inverse square root of the width
gpu_mb: 26000
alone_share: 0.05                         # tables without other rows at most 5% of a group's draws
tables: real
