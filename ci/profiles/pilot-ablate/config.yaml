# Server (through ci/launch.sh): ablations of the second pilot (charter section 8: development diagnosis only; the user
# approved them on 2026-11-18, to run after the seeds). Same corpus, split, construction and development set as the
# pilot profile (configs/corpus/pilot-near.yaml, dev_seed 0); the source model trained with seed 1 three times in
# parallel: in full (a matched reference and a repeat of the pilot run's seed 1), without the hit channel and without
# the codon channel (train.ablations). The search is taken whole from pilot run 20261118T041244 (inputs equal).
tier: pilot
seed: 1
cores: 12
blas_threads: 4
disk_gb: 40
disk_reserve_gb: 30
gpu_mem_min_mb: 20000
corpus_spec: configs/corpus/pilot-near.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  cache: true
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  # the whole search of the second pilot run (same corpus, evaluation inputs, reference, settings, code and DIAMOND
  # version: ci/stages/search_or_reuse.py links every hit file after checking its sha256)
  reuse_from: [/hy-tmp/seeddrift-ci/runs/20261118T041244-exp-0.2-pilot-ac17f283-pilot]
train:
  model: source_v0
  seed: 1
  seeds: [1]
  ablations: [hits, codons]
  parallel: 3
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
released:
  tag: v0.1.0
  lock: ci/envs/released-v0.1.0.lock.yml
  env_root: /hy-tmp/seeddrift-ci/envs
  store: /hy-tmp/seeddrift-store
  links: [reference, pfam]
  threads: 12
