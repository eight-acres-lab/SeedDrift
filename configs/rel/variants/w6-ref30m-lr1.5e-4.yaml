# Round 1a (task-breakdown section 8.6): a copy of w6-ref30m.yaml with another peak learning rate, 1.5e-4 (half of 3e-4); every other key
# unchanged. One of the short arms that bracket the rate of the width rule; the stored layout, version 0 of the tables.
# Reference arm: the axial trunk of 12 layers and width 384 (28.4 M parameters), bidirectional fill-in, relatives given.
name: w6-ref30m-lr1.5e-4
author: w6
api: 1
model: axial
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table, drawn uniformly
layout: stored
rows: [4, 16]
columns: 1024
size: 30m
relatives: true
optimizer: {lr: 1.5e-4}                   # round 1a: one side of the width rule's rate, the only change
gpu_mb: 26000                             # memory allowance; four tables of 16 rows at once were estimated at 22 GB
alone_share: 0.05                         # tables without other rows at most 5% of a group's draws (today's ruling)
tables: real
