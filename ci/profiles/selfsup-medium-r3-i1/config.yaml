# Machine i-1, round R3 of the truth-labels line (2026-11-20): R2 again on the medium corpus split three ways, so the
# sealed test part of line 0.2 (257 genomes, run 20261118T212505; the user: "Keep them out") is never trained on: the
# model trains on the train split only (711 genomes), the held-out split (278) is unchanged and never trained on, the
# test split is sealed. Three seeds of A+B1+B2+C and the readouts of round 1, as R2; the change is the data (R2
# trained on 968 genomes, the 257 included). Its training data (built here, the same per-genome arrays as R1's) is the
# reuse candidate of profile selfsup-medium-r3-i2. Development diagnosis only.
pipeline: selfsup
tier: medium
seed: 1
cores: 14
blas_threads: 2
disk_gb: 80
disk_reserve_gb: 30
gpu_mem_min_mb: 20000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
reference:
  faa: /hy-tmp/seeddrift-store/reference/reference.faa
  dmnd: /hy-tmp/seeddrift-store/reference/ref.dmnd
  cache: true
scenario:
  table: tests/ci/fixtures/tiny/scenario.tsv
  truth: tests/ci/fixtures/tiny/scenario_truth.tsv
fetch:
  allow_missing: 0.01
search:
  sensitivity: sensitive
  max_target_seqs: 1000
  evalue: 1.0e-5
  threads: 12
  block_size: 4
  nearest: 32
  keep_sseq: 32
  reuse_from: [/hy-tmp/seeddrift-ci/runs/20261118T104626-exp-0.2-pilot-948f2584-medium-search]
  reuse_required: true
train_data:
  hits: 32
  test_split: true                 # the sealed test part of line 0.2 kept out (three_way, ci/stages/train_data.py)
pairs:
  sensitivity: sensitive
  max_target_seqs: 500
  evalue: 1.0e-5
  genomes: 64
  threads: 12
  block_size: 4
train:
  model: selfsup_v0
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
  gpu_lease: false
  device: auto
  seed: 1
  variants:
    - {name: all-s1, seed: 1, objectives: [A, B1, B2, C]}
    - {name: all-s2, seed: 2, objectives: [A, B1, B2, C]}
    - {name: all-s3, seed: 3, objectives: [A, B1, B2, C]}
  readouts:
    variants: [all-s1, all-s2, all-s3]
    panels: [default, bacteria, near]
    depths: [family, order]
    knn: 8
  parallel: 3
  dev_seed: 0
  steps: 8000
  batch: 64
  lr: 3.0e-4
  eval_every: 500
  ckpt_every: 1000
islands:
  store: /hy-tmp/seeddrift-store/evalsets/islandpick
  threads: 12
  reuse_search_from: [/hy-tmp/seeddrift-ci/runs/20261120T023245-exp-truth-labels-d823bfc0-selfsup-pilot-i1-gpu]
  reuse_search_required: true
