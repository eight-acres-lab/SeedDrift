# Machine i-1: the HGT capability check (protocol w18-v0, package W18) read by the arms trained on tables of version 0
# on implant tables of version 1, adapted for them at evaluation only (readout.adapt_v0_arms: 16 of the 32 rows taken
# tier by tier, KIND_ABSENT read as KIND_NOT_SEARCHED; the programme lead's diagnosis of 2026-11-23): whether the source
# shift reads once the rows span several distance tiers, and whether the relatives add anything. A diagnosis, never the
# counting reading (that one uses round 1's arms, trained on tables of version 1, without adaptation). Stage w6_eval in
# its ruler mode, then w18_readout. The implant tables of version 1: the run of profile rel-dev-w18-rulers-v1-i1 (set
# below once it has passed; until then this profile stops at its first check). Nothing is trained.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 4
blas_threads: 2
disk_gb: 5
disk_reserve_gb: 30
gpu_mem_min_mb: 20000
corpus_spec: configs/corpus/medium.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_eval, w18_readout]
  parallel: 1
rel_w6_eval:
  from: [/hy-tmp/seeddrift-ci/runs/20261122T071504-exp-rel-3382ed5e-rel-d1-i1, /hy-tmp/seeddrift-ci/runs/20261122T121228-exp-rel-d1c-826eacc0-rel-d1c-i1]
  arms: [w6-ref30m-s1, w6-ref30m-norel-s1, w6-ref10m-s1, w6-ref100m-lr4e-4-s1, {name: w6-ref30m-s1, untrained: true}]
  tables:
    heldout: {run: /hy-tmp/seeddrift-ci/runs/W18-RULERS-V1-RUN-NOT-SET, path: data/rel_w18/rulers/tableset.json, split: 1}
  readout: {module: seeddrift.train.rel.readouts.w18_passes, presence_arms: [w6-ref30m-s1], max_rows: 32, layout: stored, in_place_only: false, adapt_v0_arms: true}   # the first reading took 44 min of GPU on i-1; under the protocol's 5 h
  best: false                    # the final weights only (protocol w18-v0)
  threads: 4
  wall_s: 10800                  # one arm's scoring
rel_w18_readout:
  tables: {run: /hy-tmp/seeddrift-ci/runs/W18-RULERS-V1-RUN-NOT-SET, path: data/rel_w18/rulers/tableset.json}
  reps: 2000
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
