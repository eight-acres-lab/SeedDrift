# SeedDrift CI, tiers T0 and T1 (see ci/README.md). Runs on GitHub's machines only: no secrets, read-only token,
# actions pinned by commit. T2 and above run on the project server from a clean pushed commit (ci/launch.sh).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}      # never cancel the checks of a pushed commit
jobs:
  t0:
    name: T0 static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462   # v2
        with:
          micromamba-version: 1.5.10-0
          environment-file: ci/envs/ci.lock.yml
          environment-name: sd-ci
          cache-environment: true
      - name: lint the CI code
        run: ruff check --select E9,F ci tests/ci seeddrift/train
      - name: hygiene, gates G1 G2 G8 on the specs, Snakemake dry runs
        run: python -m ci check
  t1:
    name: T1 tests and the ci-tiny pipeline twice
    needs: t0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462   # v2
        with:
          micromamba-version: 1.5.10-0
          environment-file: ci/envs/ci.lock.yml
          environment-name: sd-ci
          cache-environment: true
      - name: unit and gate tests
        run: python -m pytest -q tests/ci
      - name: ci-tiny, first run
        run: python -m ci run --profile ci-tiny --run-dir runs/t1-a
      - name: ci-tiny, second run
        run: python -m ci run --profile ci-tiny --run-dir runs/t1-b
      - name: the second run reproduces the first exactly
        run: python -m ci compare runs/t1-a runs/t1-b --expect exact
      - name: select-tiny twice (the corpus selection on committed catalogue snapshots); the second reproduces the first
        run: |
          python -m ci run --profile select-tiny --run-dir runs/t1-sel-a
          python -m ci run --profile select-tiny --run-dir runs/t1-sel-b
          python -m ci compare runs/t1-sel-a runs/t1-sel-b --expect exact
      - name: kill the training at a checkpoint (step 10) and between checkpoints (step 12), resume, compare
        run: |
          for stop in 10 12; do
            d=runs/t1-stop$stop
            if CI_STOP_AFTER_STEPS=$stop python -m ci run --profile ci-tiny --run-dir $d; then echo "the stopped run must fail"; exit 1; fi
            test "$(python -m ci status $d)" != passed
            test ! -e $d/data/model/model.npz
            python -c "import json,sys; s=json.load(open('$d/stages/train.json')); sys.exit(0 if s.get('stopped_at_step') == $stop else 1)"
            python -m ci run --profile ci-tiny --run-dir $d --resume
            python -c "import json,sys; s=json.load(open('$d/stages/train.json')); sys.exit(0 if s.get('resumed_from_step') == 10 else 1)"
            python -m ci compare runs/t1-a $d --expect exact
          done
      - name: keep the summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: ci-tiny-summaries
          path: |
            runs/*/record.json
            runs/*/summary.*
            runs/*/curve.csv
            runs/*/gates/*.json
            runs/*/logs/*.log
          retention-days: 30
