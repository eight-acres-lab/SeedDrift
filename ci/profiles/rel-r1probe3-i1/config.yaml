# Machine i-1, round 1, batch 3 (protocol round1, version 9): the start gate's probe of batch 3's five arms on the
# strict layout (W5's extended strict rendering merged, its pre-launch gate passed in run 20261123T222325, W6's sampler
# spot check merged: the protocol's condition for strict), 50 steps of the preflight each on the real tables of version 1
# (finite loss, peak memory, tables per second, the sampler's cost with the strict rendering), each arm alone one after
# another, all at micro-batches of 1 table (arms[].micro: arms compared in one batch share one micro-batch). Seed 4 for
# every arm, as the protocol's batch 3 (ref30m-s4 the reference). Batch 3's start needs the sum of their peaks x 1.1 +
# 6 GB free (the programme lead's rule of 2026-11-23). Nothing trained. Development diagnosis only.
pipeline: rel_traineval
tier: medium
seed: 1
cores: 8
blas_threads: 2
disk_gb: 10
disk_reserve_gb: 30
gpu_mem_min_mb: 30000
corpus_spec: configs/corpus/medium-k3.yaml
taxdump: /hy-tmp/seeddrift-store/reference/taxdump
extra_exclusions: [configs/exclusions/pilot_recipients.tsv]
rel:
  machine: i1
  stages: [w6_selftest, w6_fit]
  parallel: 3
rel_w6_selftest:
  modules: [seeddrift.train.rel.models.axial, seeddrift.train.rel.models.source]
  threads: 2
  wall_s: 840
rel_w6_fit:
  tables:
    train: {run: /hy-tmp/seeddrift-ci/runs/20261123T122205-exp-rel-c76dd7cd-rel-dev-w12-v1-k3-i1, path: data/rel_w12/v1/tableset.json, sha256: dfb612a560fc9cb8991cdb0ffce3541d1bb3ea79ab63489d58a881d5695202c1, split: 0}
    heldout: {run: /hy-tmp/seeddrift-ci/runs/20261123T122205-exp-rel-c76dd7cd-rel-dev-w12-v1-k3-i1, path: data/rel_w12/v1/tableset.json, sha256: dfb612a560fc9cb8991cdb0ffce3541d1bb3ea79ab63489d58a881d5695202c1, split: 1}
    heldout_offline: {run: /hy-tmp/seeddrift-ci/runs/20261123T124714-exp-rel-8015afa8-rel-dev-w3-offline-v1-i1, path: data/rel_w3/offline/tableset.json, sha256: 2f761265d52ac6a09dbea7285f5a90e1e6b0dbea99bb6603c5e6c260f862d496}
  arms:
    - {variant: configs/rel/variants/w6-ref30m-strict-v1.yaml, seed: 4, micro: 1}
    - {variant: configs/rel/variants/w5-src30m-s1-strict-v1.yaml, seed: 4, micro: 1}
    - {variant: configs/rel/variants/w5-src30m-s2-strict-v1.yaml, seed: 4, micro: 1}
    - {variant: configs/rel/variants/w6-ref30m-wholegene-strict-v1.yaml, seed: 4, micro: 1}
    - {variant: configs/rel/variants/w6-ref30m-samegenome-strict-v1.yaml, seed: 4, micro: 1}
    # a sixth arm goes here, at seed 4 and micro 1, if the protocol adds copy-aa30m to batch 3 (its strict variant, after its development comparison)
  preflight_only: true           # round 1's probe: every arm preflighted on the real tables, nothing trained, no checkpoint
  preflight_steps: 50
  wall_s: 1800
  eval_max_rows: 32
  data_workers: 1
train:
  gpu_lease: false
  device: auto
  python: /usr/local/bin/python3
  python_lock: ci/envs/model-torch.pip.txt
