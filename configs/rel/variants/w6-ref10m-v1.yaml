# Round 1 (the programme lead's protocol of 2026-11-23, its first batch): the reference trunk on tables of version 1
# (32 rows, 4 to 32 kept, row 0 always; KIND_ABSENT an input; self-copy rows in), every mask leak-free online, the
# whole gene on its frame relative through the pair index of W12's uncapped search (package W3's online frame
# layout); genome_of_row read only as equal or not, a learned bias of the column attention (genome_bias). The peak
# rate the width rule gives, halved (task-breakdown 8.12). 10 M at 2e-4 (half of 4e-4: the check of the rule at 10 M).
name: w6-ref10m-v1
author: w6
api: 1
model: axial
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table, drawn uniformly
layout: leakfree
whole_gene_layout: leakfree               # on the frame relative, online (tables.pair_index of the profile)
rows: [4, 32]
columns: 1024
size: {layers: 8, width: 256, genome_bias: true}
relatives: true
optimizer: {lr: 2.0e-4}
gpu_mb: 20000                             # the preflight halves the tables of a micro-batch until the memory fits
alone_share: 0.05                         # tables without other rows at most 5% of a group's draws
tables: real
