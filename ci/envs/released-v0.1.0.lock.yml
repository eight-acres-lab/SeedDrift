name: sd-released-v0.1.0
# The environment the released screen (tag v0.1.0) runs in, for stage `released` (gate G4): the deployed tools
# environment of v0.1.0 (sd-tools: DIAMOND, pyhmmer, Biopython, numpy ...), exported on 2026-11-17 on the server
# with `micromamba env export --no-md5` (all packages from conda; none from pip). With protein input the screen needs
# no gene caller, so this one environment runs it in a single process. Channel names are generic, as in ci.lock.yml.
