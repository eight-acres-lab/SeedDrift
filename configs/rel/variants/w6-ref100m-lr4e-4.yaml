# A copy of w6-ref100m.yaml with the peak learning rate of the 10 M arm, 4e-4 (the user's go-ahead, 2026-11-22, via the
# programme lead: to tell the learning rate and the size apart); every other key unchanged.
# The large size of the reference arm: 12 layers, width 768 (113 M parameters), relatives given. On a GPU with about
# 20 GB free one table of 16 rows is a micro-batch (the preflight halves the micro-batch until it fits gpu_mb).
name: w6-ref100m-lr4e-4
author: w6
api: 1
model: axial
objective: mlm
masks: [scattered, span, whole_gene]      # one scheme per table, drawn uniformly
layout: stored
rows: [4, 16]
columns: 1024
size: 100m
relatives: true
optimizer: {lr: 4.0e-4}                   # the 10 M arm's peak, against w6-ref100m's 2e-4 (the width rule)
gpu_mb: 18000
micro: 1                                  # one table per micro-batch from the start: on i-2 the preflight must not try 4 and 2
alone_share: 0.05                         # tables without other rows at most 5% of a group's draws (today's ruling)
tables: real
